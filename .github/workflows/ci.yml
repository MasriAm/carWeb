name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch supersedes an in-flight run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, migrate and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: royal_cars_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/royal_cars_ci
      # Build-time only. Never a real secret: the CI database is thrown away
      # with the runner and is never reachable from outside it.
      AUTH_SECRET: ci-build-secret-not-used-in-any-real-environment
      AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The most valuable check in this workflow. `searchVector` is a Postgres
      # GENERATED column, which Prisma cannot express, so its migration is
      # hand-written and `prisma migrate dev` cannot regenerate it. Applying
      # every migration to an empty database on each PR is what proves the
      # hand-written SQL still works and that the migration history is
      # replayable from scratch.
      - name: Apply migrations to an empty database
        run: npx prisma migrate deploy

      - name: Generate Prisma client
        run: npx prisma generate

      # Build once against the empty database this job just migrated, before
      # any rows exist. That is the state of every first deployment, and it is
      # not the same code path as a seeded build: `generateStaticParams` for
      # /dealers/[slug] returns nothing when no dealership exists, which Cache
      # Components rejects with `empty-generate-static-params`. Seeding first
      # and building once hid that for three failed production deploys.
      - name: Build against an empty database
        run: npm run build

      - name: Reset the build output
        run: rm -rf .next

      # Seeded so the second build prerenders against real rows: the hero, the
      # browse facets and the dealer pages all query during the build, and an
      # empty database would let a broken query through unnoticed.
      - name: Seed
        run: npm run db:seed

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      # Guards the rule the whole performance rebuild rests on: nothing
      # readable may be server-rendered invisible, waiting on hydration to
      # appear. This is what made the old listing page take 3.3s to show a car.
      - name: Check no content ships hidden behind hydration
        run: |
          npx next start -p 3000 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT

          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://localhost:3000/ && break
            sleep 1
          done

          status=0
          for path in "/" "/cars" "/about" "/dealers"; do
            body=$(mktemp)
            # Assert the status separately. Piping `curl -sf` straight into
            # grep swallows a 500: the pipeline yields zero matches, which is
            # indistinguishable from a clean page, so the check would pass on
            # a broken one.
            code=$(curl -s -o "$body" -w '%{http_code}' "http://localhost:3000${path}")
            if [ "$code" != "200" ]; then
              echo "::error::${path} returned HTTP ${code}"
              status=1
              rm -f "$body"
              continue
            fi

            hidden=$(grep -o 'opacity:0' "$body" | wc -l)
            if [ "$hidden" -gt 4 ]; then
              echo "::error::${path} server-renders ${hidden} elements at opacity:0"
              status=1
            else
              echo "ok  ${path} (HTTP 200, ${hidden} hidden elements)"
            fi
            rm -f "$body"
          done
          exit $status
